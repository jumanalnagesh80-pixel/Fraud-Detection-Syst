<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Sentinel Fraud Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/auth.css" />
  <link rel="stylesheet" href="/profile.css" />
  <style>
    /* ===== Improved face-login UI ===== */
    .face-login-card-v2 {
      max-width: 460px;
      width: 100%;
      padding: 28px 26px;
    }
    .face-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 340px;
      margin: 12px auto 0;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(0,0,0,0.55);
      border: 2px solid rgba(99,102,241,0.35);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .face-stage video,
    .face-stage canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);  /* mirror like a phone selfie */
    }
    .face-stage canvas { transform: scaleX(-1); pointer-events: none; }
    /* The guide circle floats inside the stage */
    .face-guide {
      position: absolute;
      top: 50%; left: 50%;
      width: 65%; height: 65%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.5);
      pointer-events: none;
      transition: border-color 0.2s ease, transform 0.3s ease;
    }
    .face-stage.detecting .face-guide { border-color: #f59e0b; }
    .face-stage.matched   .face-guide { border-color: #10b981; transform: translate(-50%, -50%) scale(1.05); }
    .face-stage.matched   { border-color: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,0.25); }
    .face-stage.failed    .face-guide { border-color: #ef4444; }

    .face-status {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      margin-top: 14px;
      border-radius: 10px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.25);
      font-size: 13.5px;
      color: #cbd5e1;
      min-height: 42px;
    }
    .face-status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(148,163,184,0.5);
      flex-shrink: 0;
    }
    .face-status.live .dot { background: #f59e0b; animation: pulse 1.4s ease-in-out infinite; }
    .face-status.ok   .dot { background: #10b981; }
    .face-status.err  .dot { background: #ef4444; }
    .face-status.err  { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.3); }
    .face-status.ok   { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.3); }

    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1) } 50% { opacity:0.4; transform:scale(1.5) } }

    .face-progress {
      width: 100%;
      height: 4px;
      background: rgba(148,163,184,0.15);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 12px;
    }
    .face-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #06b6d4);
      transition: width 0.25s ease;
    }
    .face-info-row {
      display: flex; justify-content: space-between;
      margin-top: 8px;
      font-size: 11.5px;
      color: var(--text-mute, #94a3b8);
    }
    .face-info-row strong { color: var(--text, #e2e8f0); }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Sentinel</h1>
          <p class="brand-subtitle">Fraud Detection System</p>
        </div>
      </div>

      <div class="auth-header">
        <h2>Welcome back</h2>
        <p>Sign in to your account to continue</p>
      </div>

      <div id="alert-container"></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your username" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password" />
            <button type="button" class="password-toggle" id="toggle-password">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" name="remember" id="remember" />
            <span>Remember me</span>
          </label>
          <a href="#" class="link-secondary">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          <span class="btn-text">Sign In</span>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <button type="button" class="btn btn-ghost btn-block" id="btn-face-login">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Sign in with Face
      </button>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/auth/register" class="link-primary">Create one</a></p>
      </div>
    </div>

    <!-- Face login overlay (redesigned) -->
    <div class="face-login-overlay" id="face-login-overlay" style="display:none;">
      <div class="face-login-card face-login-card-v2">
        <div class="face-login-head">
          <h3>Sign in with Face</h3>
          <button type="button" class="face-login-close" id="face-login-close">&times;</button>
        </div>

        <div class="form-group" style="margin-bottom:8px;">
          <label for="face-username">Username or Email</label>
          <input type="text" id="face-username" placeholder="Enter your username" autocomplete="username" />
        </div>

        <div class="face-stage" id="face-stage">
          <video id="face-login-video" autoplay muted playsinline></video>
          <canvas id="face-login-overlay-canvas"></canvas>
          <div class="face-guide" id="face-guide"></div>
        </div>

        <div class="face-status" id="face-status">
          <span class="dot"></span>
          <span id="face-hint">Click <strong>Start Camera</strong> below</span>
        </div>

        <div class="face-progress"><div class="face-progress-bar" id="face-progress-bar"></div></div>
        <div class="face-info-row">
          <span>Attempt <strong id="face-attempt">0</strong> / <strong id="face-attempt-max">10</strong></span>
          <span id="face-distance"></span>
        </div>

        <div class="face-controls" style="margin-top:14px; gap:10px;">
          <button type="button" class="btn btn-ghost" id="face-login-cancel">Cancel</button>
          <button type="button" class="btn btn-primary" id="face-login-start">Start Camera</button>
        </div>
      </div>
    </div>

    <div class="auth-bg">
      <div class="bg-orb orb-1"></div>
      <div class="bg-orb orb-2"></div>
      <div class="bg-orb orb-3"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>
  <script>
    // Password toggle
    document.getElementById('toggle-password').addEventListener('click', function() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    // Standard form submission
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const btnText = btn.querySelector('.btn-text');
      const original = btnText.textContent;
      btn.disabled = true; btnText.textContent = 'Signing in...';

      try {
        const r = await fetch('/auth/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            remember: document.getElementById('remember').checked,
          }),
        });
        const data = await r.json();
        if (r.ok) {
          showAlert('Login successful! Redirecting...', 'success');
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('user', JSON.stringify(data.user));
          setTimeout(() => { window.location.href = '/dashboard'; }, 500);
        } else {
          showAlert(data.error || 'Login failed', 'error');
          btn.disabled = false; btnText.textContent = original;
        }
      } catch (err) {
        showAlert('Network error. Please try again.', 'error');
        btn.disabled = false; btnText.textContent = original;
      }
    });

    function showAlert(message, type) {
      const container = document.getElementById('alert-container');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.innerHTML = `
        <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          ${type === 'success'
            ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'
            : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}
        </svg>
        <span>${message}</span>`;
      container.appendChild(alert);
      setTimeout(() => alert.classList.add('show'), 10);
      setTimeout(() => { alert.classList.remove('show'); setTimeout(() => alert.remove(), 300); }, 3000);
    }

    /* ===========================================================
       FACE LOGIN v2
       - bigger detector input (320px) for reliability
       - up to MAX_ATTEMPTS frames before giving up
       - rolling best-distance display so the user knows progress
       - guide circle changes color based on state
       =========================================================== */

    const FACE_MODEL_SOURCES = [
      'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model',
      'https://cdn.jsdelivr.net/gh/vladmandic/face-api@master/model',
      'https://justadudewhohacks.github.io/face-api.js/weights',
    ];
    const MAX_ATTEMPTS = 10;       // ~10 frames before giving up
    const TICK_MS = 700;           // gap between detection attempts

    let fl_modelsLoaded = false;
    let fl_stream = null;
    let fl_loop = null;
    let fl_busy = false;
    let fl_attempt = 0;
    let fl_bestDistance = Infinity;

    const overlay = document.getElementById('face-login-overlay');
    const stage = document.getElementById('face-stage');
    const startBtn = document.getElementById('face-login-start');
    const hintEl = document.getElementById('face-hint');
    const statusEl = document.getElementById('face-status');
    const progressBar = document.getElementById('face-progress-bar');
    const attemptEl = document.getElementById('face-attempt');
    const attemptMaxEl = document.getElementById('face-attempt-max');
    const distanceEl = document.getElementById('face-distance');

    attemptMaxEl.textContent = MAX_ATTEMPTS;

    document.getElementById('btn-face-login').addEventListener('click', () => {
      overlay.style.display = 'flex';
      resetFaceUI();
    });
    document.getElementById('face-login-close').addEventListener('click', closeFaceLogin);
    document.getElementById('face-login-cancel').addEventListener('click', closeFaceLogin);
    startBtn.addEventListener('click', startFaceLogin);

    function setStatus(text, kind = '') {
      hintEl.innerHTML = text;
      statusEl.classList.remove('live', 'ok', 'err');
      if (kind) statusEl.classList.add(kind);
      stage.classList.remove('detecting', 'matched', 'failed');
      if (kind === 'live') stage.classList.add('detecting');
      if (kind === 'ok')   stage.classList.add('matched');
      if (kind === 'err')  stage.classList.add('failed');
    }

    function resetFaceUI() {
      fl_attempt = 0;
      fl_bestDistance = Infinity;
      attemptEl.textContent = '0';
      distanceEl.textContent = '';
      progressBar.style.width = '0%';
      setStatus('Click <strong>Start Camera</strong> to begin', '');
      startBtn.disabled = false;
      startBtn.textContent = 'Start Camera';
    }

    function closeFaceLogin() {
      stopFlCamera();
      overlay.style.display = 'none';
      resetFaceUI();
    }

    function stopFlCamera() {
      if (fl_stream) {
        fl_stream.getTracks().forEach(t => t.stop());
        fl_stream = null;
      }
      if (fl_loop) { clearTimeout(fl_loop); fl_loop = null; }
      fl_busy = false;
    }

    async function loadFaceModels() {
      if (fl_modelsLoaded) return true;

      if (typeof faceapi === 'undefined') {
        setStatus('Face library not loaded — check internet', 'err');
        return false;
      }

      let lastErr = null;
      for (const url of FACE_MODEL_SOURCES) {
        try {
          setStatus(`Loading face model from <strong>${new URL(url).hostname}</strong>…`, 'live');
          await Promise.race([
            Promise.all([
              faceapi.nets.tinyFaceDetector.loadFromUri(url),
              faceapi.nets.faceLandmark68Net.loadFromUri(url),
              faceapi.nets.faceRecognitionNet.loadFromUri(url),
            ]),
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 18000)),
          ]);
          fl_modelsLoaded = true;
          return true;
        } catch (err) {
          console.warn(`Face model load failed from ${url}:`, err.message);
          lastErr = err;
        }
      }
      setStatus(`Failed to load face model: ${lastErr ? lastErr.message : 'unknown'}`, 'err');
      return false;
    }

    async function startFaceLogin() {
      const username = document.getElementById('face-username').value.trim();
      if (!username) {
        showAlert('Enter your username first', 'error');
        document.getElementById('face-username').focus();
        return;
      }
      startBtn.disabled = true;
      startBtn.textContent = 'Loading…';

      const ok = await loadFaceModels();
      if (!ok) {
        showAlert('Could not load face detection model. Check your internet.', 'error');
        startBtn.disabled = false;
        startBtn.textContent = 'Retry';
        return;
      }

      try {
        fl_stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: 'user' },
        });
      } catch (err) {
        console.error(err);
        const msg = err.name === 'NotAllowedError'
          ? 'Camera access denied. Allow camera permission in your browser and retry.'
          : err.name === 'NotFoundError'
          ? 'No camera found. Make sure your webcam is connected.'
          : `Camera error: ${err.message || err.name}`;
        setStatus(msg, 'err');
        startBtn.disabled = false;
        startBtn.textContent = 'Retry';
        return;
      }

      const video = document.getElementById('face-login-video');
      video.srcObject = fl_stream;
      video.onloadedmetadata = () => {
        startBtn.textContent = 'Detecting…';
        fl_attempt = 0;
        fl_bestDistance = Infinity;
        detectAndLogin(username);
      };
    }

    async function detectAndLogin(username) {
      const video = document.getElementById('face-login-video');
      const canvas = document.getElementById('face-login-overlay-canvas');
      if (!video || video.paused || video.ended || fl_busy) return;

      const displaySize = {
        width: video.videoWidth || 640,
        height: video.videoHeight || 480,
      };
      faceapi.matchDimensions(canvas, displaySize);
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      try {
        const detection = await faceapi
          .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({
            inputSize: 320,           // bigger = more reliable
            scoreThreshold: 0.45,
          }))
          .withFaceLandmarks()
          .withFaceDescriptor();

        if (detection) {
          const resized = faceapi.resizeResults(detection, displaySize);
          const box = resized.detection.box;
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 3;
          ctx.strokeRect(box.x, box.y, box.width, box.height);

          fl_attempt += 1;
          attemptEl.textContent = fl_attempt;
          progressBar.style.width = `${Math.min(100, (fl_attempt / MAX_ATTEMPTS) * 100)}%`;
          setStatus('Face detected — matching…', 'live');

          fl_busy = true;
          let r, data;
          try {
            const isFinal = fl_attempt >= MAX_ATTEMPTS;
            r = await fetch('/auth/api/face/login', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username,
                descriptor: Array.from(detection.descriptor),
                final: isFinal,
              }),
            });
            data = await r.json();
          } catch (err) {
            setStatus('Network error. Retrying…', 'err');
            fl_busy = false;
            fl_loop = setTimeout(() => detectAndLogin(username), TICK_MS);
            return;
          }

          if (r.ok) {
            const dist = (data.distance ?? 0).toFixed(3);
            distanceEl.innerHTML = `Distance <strong>${dist}</strong> ✓`;
            progressBar.style.width = '100%';
            setStatus(`<strong>Match!</strong> Signing you in…`, 'ok');
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('user', JSON.stringify(data.user));
            stopFlCamera();
            setTimeout(() => { window.location.href = '/dashboard'; }, 700);
            return;
          }

          // miss — track best distance, try again
          if (typeof data.distance === 'number') {
            if (data.distance < fl_bestDistance) fl_bestDistance = data.distance;
            distanceEl.innerHTML =
              `Distance <strong>${data.distance.toFixed(3)}</strong> · best ${fl_bestDistance.toFixed(3)}`;
          }
          if (r.status === 401 && data.error && /not available/i.test(data.error)) {
            // Account doesn't have face login enabled — give up immediately
            setStatus(data.error, 'err');
            stopFlCamera();
            startBtn.disabled = false;
            startBtn.textContent = 'Retry';
            return;
          }
          if (r.status === 403) {
            setStatus(data.error || 'Account locked', 'err');
            stopFlCamera();
            return;
          }
          if (fl_attempt >= MAX_ATTEMPTS) {
            setStatus(`Could not verify face after ${MAX_ATTEMPTS} attempts. Try again or use password.`, 'err');
            stopFlCamera();
            startBtn.disabled = false;
            startBtn.textContent = 'Retry';
            return;
          }
          setStatus(
            `Doesn't quite match — keep your face centered (best so far: <strong>${fl_bestDistance.toFixed(3)}</strong>)`,
            'live',
          );
          fl_busy = false;
        } else {
          setStatus('Looking for a face — center yourself in the circle', 'live');
        }
      } catch (err) {
        console.error(err);
        setStatus(`Detection error: ${err.message || err}`, 'err');
      }

      fl_loop = setTimeout(() => detectAndLogin(username), TICK_MS);
    }
  </script>
</body>
</html>
