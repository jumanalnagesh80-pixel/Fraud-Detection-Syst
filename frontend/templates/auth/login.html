<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Sentinel Fraud Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/auth.css" />
  <link rel="stylesheet" href="/profile.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Sentinel</h1>
          <p class="brand-subtitle">Fraud Detection System</p>
        </div>
      </div>

      <div class="auth-header">
        <h2>Welcome back</h2>
        <p>Sign in to your account to continue</p>
      </div>

      <div id="alert-container"></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter your username" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password" />
            <button type="button" class="password-toggle" id="toggle-password">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" name="remember" id="remember" />
            <span>Remember me</span>
          </label>
          <a href="#" class="link-secondary">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          <span class="btn-text">Sign In</span>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <button type="button" class="btn btn-ghost btn-block" id="btn-face-login">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Sign in with Face
      </button>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/auth/register" class="link-primary">Create one</a></p>
      </div>
    </div>

    <!-- Face login overlay -->
    <div class="face-login-overlay" id="face-login-overlay" style="display:none;">
      <div class="face-login-card">
        <div class="face-login-head">
          <h3>Face Login</h3>
          <button type="button" class="face-login-close" id="face-login-close">&times;</button>
        </div>
        <div class="form-group">
          <label for="face-username">Username or Email</label>
          <input type="text" id="face-username" placeholder="Enter your username" autocomplete="username" />
        </div>
        <div class="face-video-wrap" style="margin-top:10px;">
          <video id="face-login-video" autoplay muted playsinline></video>
          <canvas id="face-login-overlay-canvas"></canvas>
          <div class="face-hint" id="face-login-hint">Click Start to begin</div>
        </div>
        <div class="face-controls" style="margin-top:14px;">
          <button type="button" class="btn btn-ghost" id="face-login-cancel">Cancel</button>
          <button type="button" class="btn btn-primary" id="face-login-start">Start Camera</button>
        </div>
      </div>
    </div>

    <div class="auth-bg">
      <div class="bg-orb orb-1"></div>
      <div class="bg-orb orb-2"></div>
      <div class="bg-orb orb-3"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/dist/face-api.js"></script>
  <script>
    // Password toggle
    document.getElementById('toggle-password').addEventListener('click', function() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    // Form submission
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submit-btn');
      const btnText = btn.querySelector('.btn-text');
      const originalText = btnText.textContent;
      
      btn.disabled = true;
      btnText.textContent = 'Signing in...';
      
      const formData = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        remember: document.getElementById('remember').checked
      };
      
      try {
        const response = await fetch('/auth/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showAlert('Login successful! Redirecting...', 'success');
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('user', JSON.stringify(data.user));
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 500);
        } else {
          showAlert(data.error || 'Login failed', 'error');
          btn.disabled = false;
          btnText.textContent = originalText;
        }
      } catch (error) {
        showAlert('Network error. Please try again.', 'error');
        btn.disabled = false;
        btnText.textContent = originalText;
      }
    });

    function showAlert(message, type) {
      const container = document.getElementById('alert-container');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.innerHTML = `
        <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          ${type === 'success' 
            ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'
            : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
          }
        </svg>
        <span>${message}</span>
      `;
      container.appendChild(alert);
      setTimeout(() => alert.classList.add('show'), 10);
      setTimeout(() => {
        alert.classList.remove('show');
        setTimeout(() => alert.remove(), 300);
      }, 3000);
    }

    // ===== Face Login =====
    // Multiple CDN sources for resilience — the original face-api.js npm
    // package doesn't include the weights folder, so we use vladmandic's
    // fork (which does), with a github.io fallback.
    const FACE_MODEL_SOURCES = [
      'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.14/model',
      'https://cdn.jsdelivr.net/gh/vladmandic/face-api@master/model',
      'https://justadudewhohacks.github.io/face-api.js/weights',
    ];
    let fl_modelsLoaded = false;
    let fl_stream = null;
    let fl_loop = null;
    let fl_busy = false;

    const overlay = document.getElementById('face-login-overlay');
    document.getElementById('btn-face-login').addEventListener('click', () => {
      overlay.style.display = 'flex';
    });
    document.getElementById('face-login-close').addEventListener('click', closeFaceLogin);
    document.getElementById('face-login-cancel').addEventListener('click', closeFaceLogin);
    document.getElementById('face-login-start').addEventListener('click', startFaceLogin);

    function closeFaceLogin() {
      stopFlCamera();
      overlay.style.display = 'none';
      document.getElementById('face-login-hint').textContent = 'Click Start to begin';
      document.getElementById('face-login-start').disabled = false;
      document.getElementById('face-login-start').textContent = 'Start Camera';
    }

    function stopFlCamera() {
      if (fl_stream) {
        fl_stream.getTracks().forEach(t => t.stop());
        fl_stream = null;
      }
      if (fl_loop) { clearTimeout(fl_loop); fl_loop = null; }
    }

    async function loadFaceModels() {
      if (fl_modelsLoaded) return true;
      const hint = document.getElementById('face-login-hint');

      if (typeof faceapi === 'undefined') {
        hint.textContent = 'Face library not loaded — check internet';
        return false;
      }

      let lastErr = null;
      for (const url of FACE_MODEL_SOURCES) {
        try {
          hint.textContent = `Loading face model from ${new URL(url).hostname}…`;
          await Promise.race([
            Promise.all([
              faceapi.nets.tinyFaceDetector.loadFromUri(url),
              faceapi.nets.faceLandmark68Net.loadFromUri(url),
              faceapi.nets.faceRecognitionNet.loadFromUri(url),
            ]),
            new Promise((_, reject) =>
              setTimeout(() => reject(new Error('timeout')), 15000)
            ),
          ]);
          fl_modelsLoaded = true;
          return true;
        } catch (err) {
          console.warn(`Face model load failed from ${url}:`, err.message);
          lastErr = err;
        }
      }

      hint.textContent = `Failed to load face model: ${lastErr ? lastErr.message : 'unknown error'}`;
      return false;
    }

    async function startFaceLogin() {
      const username = document.getElementById('face-username').value.trim();
      if (!username) {
        showAlert('Enter your username first', 'error');
        return;
      }
      const startBtn = document.getElementById('face-login-start');
      startBtn.disabled = true;
      startBtn.textContent = 'Loading…';

      const ok = await loadFaceModels();
      if (!ok) {
        showAlert('Could not load face detection model. Check your internet connection.', 'error');
        startBtn.disabled = false;
        startBtn.textContent = 'Retry';
        return;
      }

      try {
        fl_stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 480, height: 360, facingMode: 'user' },
        });
        const video = document.getElementById('face-login-video');
        video.srcObject = fl_stream;
        video.onloadedmetadata = () => detectAndLogin(username);
        startBtn.textContent = 'Looking for face…';
      } catch (err) {
        console.error(err);
        showAlert('Camera access denied. Allow camera permission and try again.', 'error');
        startBtn.disabled = false;
        startBtn.textContent = 'Retry';
      }
    }

    async function detectAndLogin(username) {
      const video = document.getElementById('face-login-video');
      const canvas = document.getElementById('face-login-overlay-canvas');
      const hint = document.getElementById('face-login-hint');
      if (!video || video.paused || video.ended || fl_busy) return;

      const displaySize = { width: video.videoWidth || 480, height: video.videoHeight || 360 };
      faceapi.matchDimensions(canvas, displaySize);

      try {
        const detection = await faceapi
          .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 }))
          .withFaceLandmarks()
          .withFaceDescriptor();

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (detection) {
          const resized = faceapi.resizeResults(detection, displaySize);
          const box = resized.detection.box;
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 3;
          ctx.strokeRect(box.x, box.y, box.width, box.height);
          hint.textContent = 'Verifying…';

          fl_busy = true;
          const r = await fetch('/auth/api/face/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username,
              descriptor: Array.from(detection.descriptor),
            }),
          });
          const data = await r.json();

          if (r.ok) {
            hint.textContent = '✓ Match — signing in…';
            showAlert('Face matched! Redirecting…', 'success');
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('user', JSON.stringify(data.user));
            stopFlCamera();
            setTimeout(() => { window.location.href = '/dashboard'; }, 600);
            return;
          } else {
            hint.textContent = data.error || 'Face did not match — keep trying';
            fl_busy = false;
          }
        } else {
          hint.textContent = 'No face detected — center your face';
        }
      } catch (err) {
        console.error(err);
      }

      fl_loop = setTimeout(() => detectAndLogin(username), 600);
    }
  </script>
</body>
</html>
